<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Stopwatch</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f4ec;
      --muted: #b8c0c7;
      --panel: rgba(8, 12, 18, 0.72);
      --panel-strong: rgba(10, 15, 22, 0.9);
      --line: rgba(255, 255, 255, 0.16);
      --accent: #ff4d5e;
      --accent-2: #2dd9c5;
      --gold: #f4c95d;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(45, 217, 197, 0.22), transparent 28rem),
        radial-gradient(circle at 80% 10%, rgba(244, 201, 93, 0.18), transparent 24rem),
        linear-gradient(135deg, #11161d 0%, #22242a 45%, #0b0f14 100%);
      color: var(--ink);
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 56px);
    }

    .stopwatch {
      width: min(100%, 520px);
      display: grid;
      gap: 18px;
      justify-items: center;
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(15, 20, 28, 0.82), rgba(7, 10, 14, 0.76));
      box-shadow:
        0 28px 70px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -18px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(16px);
    }

    .brand {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 5px rgba(184, 192, 199, 0.12);
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .status-dot.running {
      background: var(--accent-2);
      box-shadow: 0 0 0 5px rgba(45, 217, 197, 0.14), 0 0 28px rgba(45, 217, 197, 0.8);
    }

    .dial {
      width: min(78vw, 350px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        conic-gradient(from 270deg, rgba(255, 77, 94, 0.95) var(--progress), rgba(255, 255, 255, 0.1) 0),
        radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 64%);
      box-shadow:
        0 20px 42px rgba(0, 0, 0, 0.42),
        inset 0 0 0 8px rgba(255, 255, 255, 0.06),
        inset 0 0 42px rgba(255, 255, 255, 0.1);
      transform: perspective(900px) rotateX(8deg);
    }

    .face {
      width: calc(100% - 28px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.11), transparent 34%),
        linear-gradient(145deg, rgba(19, 25, 33, 0.96), rgba(6, 9, 13, 0.96));
      box-shadow:
        inset 0 12px 24px rgba(255, 255, 255, 0.08),
        inset 0 -16px 22px rgba(0, 0, 0, 0.42);
    }

    .time {
      width: 100%;
      padding: 0 16px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.45rem, 13vw, 4.7rem);
      font-weight: 800;
      line-height: 1;
      text-align: center;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
      letter-spacing: 0;
    }

    .centis {
      color: var(--gold);
      font-size: 0.48em;
      vertical-align: 0.38em;
    }

    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    button {
      min-width: 0;
      min-height: 58px;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      font: inherit;
      font-size: clamp(0.82rem, 3vw, 0.96rem);
      font-weight: 800;
      letter-spacing: 0;
      cursor: pointer;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.02)),
        var(--button-bg);
      box-shadow:
        0 9px 0 var(--button-edge),
        0 16px 24px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transform: translateY(0);
      transition: transform 90ms ease, box-shadow 90ms ease, filter 140ms ease;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid rgba(244, 201, 93, 0.75);
      outline-offset: 5px;
    }

    button:active {
      transform: translateY(7px);
      box-shadow:
        0 2px 0 var(--button-edge),
        0 8px 16px rgba(0, 0, 0, 0.36),
        inset 0 2px 8px rgba(0, 0, 0, 0.24);
      filter: brightness(1.08);
    }

    .primary {
      --button-bg: linear-gradient(145deg, #ff4d5e, #a92c48);
      --button-edge: #6f1f32;
    }

    .secondary {
      --button-bg: linear-gradient(145deg, #2dd9c5, #176d71);
      --button-edge: #0f4548;
    }

    .neutral {
      --button-bg: linear-gradient(145deg, #54606c, #252d36);
      --button-edge: #141a22;
    }

    .laps {
      width: 100%;
      max-height: 160px;
      margin: 0;
      padding: 0;
      overflow: auto;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.18);
    }

    .laps:empty {
      display: none;
    }

    .laps li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 14px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .laps li:last-child {
      border-bottom: 0;
    }

    .laps li.new-lap {
      animation: lap-pop 620ms ease both;
    }

    @keyframes lap-pop {
      0% {
        background: rgba(45, 217, 197, 0.22);
        box-shadow: inset 0 0 0 1px rgba(45, 217, 197, 0.36);
        transform: translateY(-6px) scale(1.02);
      }

      100% {
        background: transparent;
        box-shadow: inset 0 0 0 1px rgba(45, 217, 197, 0);
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 620px) {
      .shell {
        align-items: center;
        justify-items: stretch;
        padding: 14px;
      }

      .stopwatch {
        width: min(100%, 362px);
        padding: 16px;
      }

      .dial {
        width: min(100%, 270px);
      }

      .time {
        font-size: clamp(2.1rem, 14vw, 3.4rem);
      }

      .controls {
        grid-template-columns: 1fr;
      }

      button {
        min-height: 54px;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <main class="shell">
    <section class="stopwatch" aria-label="Stopwatch">
      <div class="brand">
        <span>Pulse Stopwatch</span>
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
      </div>
      <div class="dial" id="dial" style="--progress: 0turn">
        <div class="face">
          <div class="time" id="time">00:00<span class="centis">.00</span></div>
        </div>
      </div>
      <div class="controls">
        <button class="primary" id="toggle" type="button">Start</button>
        <button class="secondary" id="lap" type="button">Lap</button>
        <button class="neutral" id="reset" type="button">Reset</button>
      </div>
      <ol class="laps" id="laps" aria-label="Lap times"></ol>
    </section>
  </main>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

    const canvas = document.querySelector("#scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0.6, 8);

    const ambient = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambient);

    const key = new THREE.PointLight(0x2dd9c5, 38, 20);
    key.position.set(-3.8, 4.8, 5.5);
    scene.add(key);

    const warm = new THREE.PointLight(0xff4d5e, 30, 18);
    warm.position.set(3.2, -2.8, 4.8);
    scene.add(warm);

    const group = new THREE.Group();
    scene.add(group);

    const ringMaterial = new THREE.MeshStandardMaterial({
      color: 0xff4d5e,
      metalness: 0.72,
      roughness: 0.22,
      emissive: 0x23040a,
      emissiveIntensity: 0.32
    });

    const mintMaterial = new THREE.MeshStandardMaterial({
      color: 0x2dd9c5,
      metalness: 0.45,
      roughness: 0.28,
      emissive: 0x04221e,
      emissiveIntensity: 0.28
    });

    const goldMaterial = new THREE.MeshStandardMaterial({
      color: 0xf4c95d,
      metalness: 0.58,
      roughness: 0.24,
      emissive: 0x241805,
      emissiveIntensity: 0.18
    });

    const outer = new THREE.Mesh(new THREE.TorusGeometry(2.35, 0.07, 18, 132), ringMaterial);
    const inner = new THREE.Mesh(new THREE.TorusGeometry(1.82, 0.035, 12, 132), mintMaterial);
    group.add(outer, inner);

    const ticks = new THREE.Group();
    for (let i = 0; i < 60; i += 1) {
      const tick = new THREE.Mesh(
        new THREE.BoxGeometry(i % 5 === 0 ? 0.052 : 0.024, i % 5 === 0 ? 0.26 : 0.13, 0.055),
        i % 5 === 0 ? goldMaterial : mintMaterial
      );
      const angle = (i / 60) * Math.PI * 2;
      tick.position.set(Math.sin(angle) * 2.08, Math.cos(angle) * 2.08, 0);
      tick.rotation.z = -angle;
      ticks.add(tick);
    }
    group.add(ticks);

    const hand = new THREE.Group();
    const stem = new THREE.Mesh(new THREE.BoxGeometry(0.035, 1.72, 0.07), ringMaterial);
    stem.position.y = 0.82;
    const counter = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 16), goldMaterial);
    hand.add(stem, counter);
    group.add(hand);

    const orbiters = [];
    for (let i = 0; i < 9; i += 1) {
      const orbiter = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.08 + (i % 3) * 0.025, 1),
        i % 2 ? mintMaterial : goldMaterial
      );
      orbiter.userData = {
        radius: 2.8 + i * 0.16,
        speed: 0.42 + i * 0.035,
        offset: i * 0.74
      };
      orbiters.push(orbiter);
      scene.add(orbiter);
    }

    const timeEl = document.querySelector("#time");
    const toggleBtn = document.querySelector("#toggle");
    const lapBtn = document.querySelector("#lap");
    const resetBtn = document.querySelector("#reset");
    const lapsEl = document.querySelector("#laps");
    const dial = document.querySelector("#dial");
    const statusDot = document.querySelector("#statusDot");

    let running = false;
    let startTime = 0;
    let elapsed = 0;
    let rafId = 0;
    let lapCount = 0;

    function formatTime(ms) {
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const centis = Math.floor((ms % 1000) / 10);
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}<span class="centis">.${String(centis).padStart(2, "0")}</span>`;
    }

    function currentElapsed() {
      return running ? performance.now() - startTime + elapsed : elapsed;
    }

    function renderTime() {
      const ms = currentElapsed();
      timeEl.innerHTML = formatTime(ms);
      dial.style.setProperty("--progress", `${(ms % 60000) / 60000}turn`);
      hand.rotation.z = -((ms % 60000) / 60000) * Math.PI * 2;
      return ms;
    }

    function tick() {
      renderTime();
      rafId = requestAnimationFrame(tick);
    }

    function tap() {
      if ("vibrate" in navigator) {
        navigator.vibrate(12);
      }
    }

    function setRunning(value) {
      running = value;
      toggleBtn.textContent = running ? "Pause" : "Start";
      statusDot.classList.toggle("running", running);
      if (running) {
        startTime = performance.now();
        rafId = requestAnimationFrame(tick);
      } else {
        elapsed = currentElapsed();
        cancelAnimationFrame(rafId);
        renderTime();
      }
    }

    toggleBtn.addEventListener("click", () => {
      tap();
      setRunning(!running);
    });

    lapBtn.addEventListener("click", () => {
      tap();
      const ms = renderTime();
      if (ms <= 0) return;
      lapCount += 1;
      const item = document.createElement("li");
      item.className = "new-lap";
      item.innerHTML = `<span>Lap ${lapCount}</span><strong>${formatTime(ms)}</strong>`;
      lapsEl.prepend(item);
      item.addEventListener("animationend", () => item.classList.remove("new-lap"), { once: true });
    });

    resetBtn.addEventListener("click", () => {
      tap();
      running = false;
      cancelAnimationFrame(rafId);
      elapsed = 0;
      lapCount = 0;
      toggleBtn.textContent = "Start";
      statusDot.classList.remove("running");
      lapsEl.replaceChildren();
      renderTime();
    });

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      group.scale.setScalar(Math.min(width, height) < 560 ? 0.74 : 1);
    }

    function animateScene(time) {
      const t = time * 0.001;
      group.rotation.x = Math.sin(t * 0.42) * 0.16;
      group.rotation.y = Math.sin(t * 0.34) * 0.28;
      ticks.rotation.z = t * 0.045;
      const pulse = running ? 1 + Math.sin(t * 8) * 0.025 : 1 + Math.sin(t * 1.8) * 0.012;
      outer.scale.setScalar(pulse);
      inner.scale.setScalar(1 / pulse);

      orbiters.forEach((orbiter, index) => {
        const angle = t * orbiter.userData.speed + orbiter.userData.offset;
        orbiter.position.set(
          Math.cos(angle) * orbiter.userData.radius,
          Math.sin(angle * 0.9) * 0.76,
          Math.sin(angle) * 1.1 - 0.8
        );
        orbiter.rotation.x += 0.012 + index * 0.001;
        orbiter.rotation.y += 0.018;
      });

      renderer.render(scene, camera);
      requestAnimationFrame(animateScene);
    }

    window.addEventListener("resize", resize);
    resize();
    renderTime();
    requestAnimationFrame(animateScene);
  </script>
</body>
</html>
